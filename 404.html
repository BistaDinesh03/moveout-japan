<!DOCTYPE html>
<html lang="en">
<head>

  <title>Page Not Found (404) | Move Out Japan</title>
  <meta name="description" content="The page you are looking for does not exist. Find moving-out guides, pricing, and free quotes for foreigners in Japan on Move Out Japan.">

  <!--
    REPAIR NOTE (Phase 4):
    Cloudflare Pages serves this file automatically for any unmatched route,
    with a real HTTP 404 status (not a soft-404 that returns 200 + homepage).
    `noindex` is set because the same document can also be requested directly
    at /404, which may be served with 200; it should never be indexed either way.
  -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://moveoutjapan.pages.dev/404">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Move Out Japan">
  <meta property="og:title" content="Page Not Found (404) | Move Out Japan">
  <meta property="og:description" content="The page you are looking for does not exist.">
  <meta property="og:image" content="https://moveoutjapan.pages.dev/favicon/web-app-manifest-512x512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Page Not Found (404) | Move Out Japan">

  <meta name="theme-color" content="#111827">
  <meta name="application-name" content="Move Out Japan">
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">

  <link rel="stylesheet" href="/assets/css/style.css">

  <style>
    .error-page {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
    }
    .error-code {
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 800;
      line-height: 1;
      color: #4f46e5;
      letter-spacing: -0.03em;
    }
    .error-page h1 {
      margin: 16px 0 12px;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }
    .error-page p {
      max-width: 540px;
      margin: 0 auto 12px;
      color: #6b7280;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
    }
    .error-links {
      margin-top: 36px;
      font-size: 0.95rem;
    }
    .error-links a {
      color: #4f46e5;
      text-decoration: underline;
      margin: 0 10px;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-nav">Skip to main content</a>

  <div id="site-header"></div>

  <main id="main-content">
    <section class="error-page" aria-labelledby="error-heading">
      <div class="error-code" aria-hidden="true">404</div>
      <h1 id="error-heading">We couldn't find that page</h1>
      <p>
        The link may be out of date, or the page may have moved. Nothing you
        typed has been lost — let's get you back on track.
      </p>

      <div class="error-actions">
        <a href="/" class="cta-btn">Back to Home</a>
        <a href="/contact" class="cta-btn cta-btn-outline">Request a Free Quote</a>
      </div>

      <nav class="error-links" aria-label="Popular pages">
        <a href="/blog">Blog</a>
        <a href="/pages/pricing">Pricing</a>
        <a href="/pages/faq">FAQ</a>
        <a href="/pages/services">Services</a>
        <a href="/sitemap">Sitemap</a>
      </nav>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="/assets/js/main.js"></script>
</body>
</html>
